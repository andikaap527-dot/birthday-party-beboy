<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beboy’s Flower Garden Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a floating flower-garden island in a pastel sky.
     Layout: full-bleed 3D scene, title card top-left, control dock bottom-centre. */
  --rose: #e2508a;
  --rose-deep: #b3346a;
  --blush: #fbe3ee;
  --lilac: #7d5cc0;
  --ink: #4a1f3d;
  --panel: rgba(255, 248, 251, 0.88);
  --display: "Dancing Script", "Brush Script MT", "Segoe Script", cursive;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--blush);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#scene { position: fixed; inset: 0; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; outline: none; }

.hud {
  position: fixed; inset: 0;
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px; padding: 16px;
  pointer-events: none;
}
.panel {
  pointer-events: auto;
  box-sizing: border-box;
  background: var(--panel);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(150, 40, 95, 0.16);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.card {
  grid-column: 1; grid-row: 1; align-self: start;
  max-width: 330px;
  padding: 14px 18px 15px;
  display: flex; flex-direction: column; gap: 6px;
}
.card h1 {
  font-family: var(--display); font-weight: 700;
  font-size: 34px; line-height: 1.05; margin: 0;
  color: var(--rose-deep); text-wrap: balance;
}
.card p { margin: 0; font-size: 14px; line-height: 1.45; }
.status { color: #9e1f4f; font-weight: 800; }

.tour {
  grid-column: 3; grid-row: 1 / span 2; align-self: start;
  width: 216px; max-height: 100%; overflow-y: auto;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.tour h2 {
  margin: 0; font-family: var(--display); font-weight: 700;
  font-size: 26px; line-height: 1.1; color: var(--rose-deep); text-wrap: balance;
}
.spots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.spots .go-tour { grid-column: 1 / -1; }
.tip { margin: 0; font-size: 12.5px; line-height: 1.4; }

.dock {
  grid-column: 1 / -1; grid-row: 3; justify-self: center;
  max-width: 100%;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center;
  gap: 10px 14px;
  padding: 12px 14px;
  border-radius: 22px;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--lilac); padding-left: 6px; }
.field input {
  font: inherit; font-weight: 800; font-size: 15px;
  width: 170px; box-sizing: border-box;
  padding: 9px 14px; border-radius: 999px;
  border: 2px solid #f1bfd4; background: #fff; color: var(--ink);
}
.field input::placeholder { color: #b98aa6; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.hud button {
  font: inherit; font-weight: 800; font-size: 14px;
  padding: 10px 16px; border-radius: 999px;
  border: 2px solid #f1bfd4; background: #fff; color: var(--ink);
  cursor: pointer; transition: transform 0.15s ease, background-color 0.15s ease;
}
.spots button { font-size: 13px; padding: 8px 10px; }
.hud button:hover { background: #fff0f6; transform: translateY(-1px); }
.hud button.primary { background: var(--rose); border-color: var(--rose); color: #fff; }
.hud button.primary:hover { background: var(--rose-deep); border-color: var(--rose-deep); }
.hud button[aria-current="true"] { background: #fde3ee; border-color: var(--rose); color: var(--rose-deep); }
.hud button:disabled { opacity: 0.6; cursor: default; transform: none; }
.hud button:focus-visible, .field input:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

@media (max-width: 860px) {
  .card { max-width: 270px; }
  .card h1 { font-size: 29px; }
  .tour { width: 196px; }
}
@media (max-width: 600px) {
  .hud { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px; padding: 10px; }
  .card { grid-column: 1; grid-row: 1; max-width: none; padding: 10px 14px; gap: 4px; }
  .card h1 { font-size: 26px; }
  .tour { grid-column: 1; grid-row: 3; width: auto; max-height: none; overflow: visible; padding: 8px; gap: 0; border-radius: 16px; }
  .tour h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tour .tip { display: none; }
  .spots { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; scrollbar-width: none; }
  .spots::-webkit-scrollbar { display: none; }
  .spots button { flex: none; }
  .dock { grid-column: 1; grid-row: 4; justify-self: stretch; padding: 10px; gap: 8px; border-radius: 18px; }
  .field, .field input { width: 100%; }
  .actions button { padding: 9px 12px; font-size: 13px; }
}
@media (max-height: 560px) and (min-width: 601px) {
  .tour .tip { display: none; }
  .spots button { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .hud button { transition: none; }
  .hud button:hover { transform: none; }
}
</style>
</head>
<body>
<div id="scene" role="img" aria-label="A 3D floating garden island set for a girl's birthday party: a flower arch with a Happy Birthday banner, a three-tier cake with candles, cupcakes, presents, balloons, cherry blossom trees, flower beds of roses, tulips and daisies, and the birthday girl in a pink petal dress and flower crown, who can walk to every spot."></div>

<div class="hud">
  <header class="card panel">
    <h1 id="heading">Beboy’s Flower Garden Birthday</h1>
    <p id="status" class="status" hidden></p>
  </header>

  <nav class="tour panel" aria-labelledby="tourTitle">
    <h2 id="tourTitle">Walk with <span class="girl-name">Beboy</span></h2>
    <div class="spots">
      <button type="button" id="tourBtn" class="primary go-tour">Take the tour</button>
      <button type="button" data-spot="path">Garden path</button>
      <button type="button" data-spot="wish">Birthday wish</button>
      <button type="button" data-spot="presents">Presents</button>
      <button type="button" data-spot="cake">The cake</button>
      <button type="button" data-spot="balloons">Balloons</button>
      <button type="button" data-spot="arch">Flower arch</button>
      <button type="button" data-spot="secret">Secret garden</button>
      <button type="button" data-spot="trees">Cherry trees</button>
      <button type="button" data-spot="flowers">Flower beds</button>
      <button type="button" data-spot="overview">Whole party</button>
    </div>
    <p class="tip">Arrow keys or WASD walk her around too.</p>
    <p id="live" class="sr-only" aria-live="polite"></p>
  </nav>

  <div class="dock panel" id="dock">
    <div class="actions">
      <button type="button" id="wish" class="primary">Blow out the candles</button>
      <button type="button" id="song">Play the song</button>
      <button type="button" id="confetti">Confetti</button>
      <button type="button" id="spin">Stop spinning</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');
  function fail(msg) { statusEl.textContent = msg; statusEl.hidden = false; }
  if (!window.THREE || !THREE.OrbitControls) {
    fail('The 3D scene could not load. Check your internet connection, then reload the page.');
    return;
  }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    fail('This browser could not start 3D graphics (WebGL). Try another browser or device.');
    return;
  }

  // ---------------------------------------------------------------- helpers
  var seed = 20261116;
  function rnd() { // deterministic layout, same garden every visit
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function R(a, b) { return a + rnd() * (b - a); }
  function P(arr) { return arr[Math.floor(rnd() * arr.length)]; }
  function C(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function pickR(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  var TAU = Math.PI * 2;
  var V3 = THREE.Vector3;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function canvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function canvasTex(c, repX, repY) {
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    if (repX) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY || repX); }
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---------------------------------------------------------------- renderer, scene, camera
  var host = document.getElementById('scene');
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  (function sky() {
    var c = canvas(4, 512), g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, 512);
    gr.addColorStop(0, '#f3b9d3');
    gr.addColorStop(0.42, '#ead6f7');
    gr.addColorStop(0.78, '#fde6ee');
    gr.addColorStop(1, '#ffe3d3');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
    scene.background = canvasTex(c);
  })();

  var aspect0 = window.innerWidth / window.innerHeight;
  var camera = new THREE.PerspectiveCamera(42, aspect0, 0.1, 300);
  var target = new V3(0, 2.6, 0);
  var k = aspect0 < 1 ? Math.min(1.9, 0.85 / aspect0) : 1;
  camera.position.set(0, 5.8 * k, 20.5 * k).add(target);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(target);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 7;
  controls.maxDistance = 48;
  controls.minPolarAngle = Math.PI * 0.08;
  controls.maxPolarAngle = Math.PI * 0.58;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.55;

  // lights
  scene.add(new THREE.HemisphereLight(C(0xfff3f9), C(0x93c97c), 0.55));
  scene.add(new THREE.AmbientLight(C(0xffe6f0), 0.16));
  var sun = new THREE.DirectionalLight(C(0xfff0df), 0.82);
  sun.position.set(9, 16, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera;
  sc.left = -15; sc.right = 15; sc.top = 15; sc.bottom = -15; sc.near = 1; sc.far = 60;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.03;
  scene.add(sun);

  // soft environment for shiny balloons and gold
  var envTex = (function () {
    var c = canvas(16, 256), g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, '#f8cfe0'); gr.addColorStop(0.5, '#e7d6f6');
    gr.addColorStop(0.62, '#cfe9bd'); gr.addColorStop(1, '#8fc77a');
    g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
    var es = new THREE.Scene();
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    es.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide })));
    var panel = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
    panel.position.set(6, 12, 8); panel.lookAt(0, 0, 0); es.add(panel);
    var panel2 = panel.clone(); panel2.position.set(-10, 6, -6); panel2.lookAt(0, 0, 0); es.add(panel2);
    var pm = new THREE.PMREMGenerator(renderer);
    var rt = pm.fromScene(es, 0.02);
    pm.dispose();
    return rt.texture;
  })();

  // material cache
  var matCache = {};
  function mat(hex, opts) {
    opts = opts || {};
    var key = hex + JSON.stringify(opts);
    if (!matCache[key]) {
      var o = { color: C(hex), roughness: 0.7, metalness: 0 };
      for (var k2 in opts) o[k2] = opts[k2];
      matCache[key] = new THREE.MeshStandardMaterial(o);
    }
    return matCache[key];
  }
  function mesh(geo, material, x, y, z, parent) {
    var m = new THREE.Mesh(geo, material);
    m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = true; m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }

  // instancing: every repeated little part (petals, beads, leaves) goes into one draw call per kind
  var WHITE = new THREE.Color(1, 1, 1);
  var flowerMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.62, side: THREE.DoubleSide });
  var solidMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  var flatMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82, flatShading: true });
  var parts = {};
  function definePart(name, geo, material) { parts[name] = { geo: geo, material: material, items: [] }; }
  function put(name, m, c) { parts[name].items.push(m, c || WHITE); }
  var _o = new THREE.Object3D();
  function M(x, y, z, rx, ry, rz, sx, sy, sz) {
    _o.position.set(x || 0, y || 0, z || 0);
    _o.rotation.set(rx || 0, ry || 0, rz || 0);
    var s = sx === undefined ? 1 : sx;
    _o.scale.set(s, sy === undefined ? s : sy, sz === undefined ? s : sz);
    _o.updateMatrix();
    return _o.matrix.clone();
  }
  function mul(a, b) { return a.clone().multiply(b); }
  function buildParts() {
    Object.keys(parts).forEach(function (name) {
      var p = parts[name], n = p.items.length / 2;
      if (!n) return;
      var im = new THREE.InstancedMesh(p.geo, p.material, n);
      for (var i = 0; i < n; i++) { im.setMatrixAt(i, p.items[2 * i]); im.setColorAt(i, p.items[2 * i + 1]); }
      im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
      scene.add(im);
    });
  }

  // petal-cup geometry with scalloped rims, used for roses and tulips
  function petalLathe(points, segs, lobes, amp, lift) {
    var g = new THREE.LatheGeometry(points.map(function (p) { return new THREE.Vector2(p[0], p[1]); }), segs);
    var pos = g.attributes.position, h = points[points.length - 1][1];
    for (var i = 0; i < pos.count; i++) {
      var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      var a = Math.atan2(z, x), f = Math.pow(Math.max(0, y) / h, 2), w = Math.sin(a * lobes);
      var kk = 1 + amp * f * w;
      pos.setXYZ(i, x * kk, y + lift * f * Math.max(0, w), z * kk);
    }
    g.computeVertexNormals();
    return g;
  }

  var unitSphere = new THREE.SphereGeometry(1, 10, 8);
  definePart('stem', new THREE.CylinderGeometry(0.022, 0.03, 1, 5).translate(0, 0.5, 0), solidMat);
  definePart('leaf', new THREE.SphereGeometry(1, 8, 6).scale(0.07, 0.26, 0.02).translate(0, 0.26, 0), flowerMat);
  definePart('petal', new THREE.SphereGeometry(1, 8, 6).scale(0.055, 0.018, 0.15).translate(0, 0, 0.17), flowerMat);
  definePart('center', new THREE.SphereGeometry(0.08, 12, 8).scale(1, 0.55, 1), solidMat);
  definePart('roseOuter', petalLathe([[0.02, 0], [0.1, 0.015], [0.17, 0.05], [0.215, 0.09], [0.25, 0.125]], 20, 5, 0.13, 0.02), flowerMat);
  definePart('roseMid', petalLathe([[0.02, 0.01], [0.08, 0.03], [0.13, 0.08], [0.155, 0.14], [0.16, 0.17]], 18, 5, 0.1, 0.015), flowerMat);
  definePart('roseInner', petalLathe([[0.01, 0.03], [0.06, 0.06], [0.095, 0.12], [0.105, 0.18], [0.092, 0.205]], 16, 3, 0.16, 0.01), flowerMat);
  definePart('bud', new THREE.SphereGeometry(0.068, 12, 10).scale(1, 1.15, 1).translate(0, 0.15, 0), solidMat);
  definePart('tulip', petalLathe([[0.01, 0], [0.07, 0.02], [0.13, 0.08], [0.155, 0.17], [0.15, 0.27], [0.125, 0.36]], 18, 3, 0.1, 0.06), flowerMat);
  definePart('pom', new THREE.IcosahedronGeometry(0.2, 1), flatMat);
  definePart('baby', new THREE.SphereGeometry(0.035, 6, 5), solidMat);
  definePart('tuft', new THREE.ConeGeometry(0.045, 0.28, 4).translate(0, 0.14, 0), flatMat);
  definePart('bead', unitSphere, solidMat);
  definePart('drip', unitSphere, solidMat);
  definePart('blossom', new THREE.IcosahedronGeometry(0.09, 0), flatMat);
  definePart('wrapper', new THREE.CylinderGeometry(0.17, 0.12, 0.2, 16), flatMat);
  definePart('frost', new THREE.TorusGeometry(1, 0.55, 10, 20).rotateX(Math.PI / 2), solidMat);
  definePart('tip', new THREE.ConeGeometry(0.07, 0.14, 12), solidMat);

  // palettes
  var ROSE_COLS = [0xf06a9b, 0xf9a8c6, 0xffc1a6, 0xfff4f6, 0xd94f7d, 0xfbe3a2];
  var TULIP_COLS = [0xf27aa5, 0xff9b8a, 0xc79ae8, 0xffd36e, 0xfff0f5, 0xe8558a];
  var DAISY_COLS = [0xffffff, 0xffd6e7, 0xe9d6ff, 0xfff3c4];
  var POM_COLS = [0xc7a6ec, 0xa9c3f2, 0xf7b6d2, 0xfff5fa, 0xd8b4f0];
  var LEAF_COLS = [0x5f9e57, 0x6fb265, 0x4e8a49, 0x78b86a];
  var PARTY_COLS = [0xf27aa5, 0xffd166, 0xc9a7ef, 0xa8e6cf, 0xffc4a3, 0xffffff, 0xe2508a];
  function leafC() { return C(P(LEAF_COLS)); }

  // ---------------------------------------------------------------- flower builders
  function stemAndLeaves(base, h, leafScale) {
    put('stem', mul(base, M(0, 0, 0, 0, 0, 0, 1, h, 1)), C(0x5a9a52));
    var n = rnd() < 0.55 ? 2 : 1;
    for (var i = 0; i < n; i++) put('leaf', mul(base, M(0, 0.02, 0, 0, R(0, TAU), R(0.5, 1.1), leafScale * R(0.8, 1.15))), leafC());
  }
  function roseHead(m, c) {
    put('roseOuter', m, c.clone().multiplyScalar(0.86));
    put('roseMid', mul(m, M(0, 0, 0, 0, 0.63, 0)), c);
    put('roseInner', mul(m, M(0, 0, 0, 0, 1.3, 0)), c.clone().lerp(WHITE, 0.08));
    put('bud', m, c.clone().multiplyScalar(0.92));
  }
  function plant(type, x, z, hex) {
    var s, h, base, head;
    if (type === 'rose') {
      s = R(0.85, 1.15); h = R(0.45, 0.8);
      base = M(x, 0, z, 0, R(0, TAU), 0, s); stemAndLeaves(base, h, 1);
      roseHead(mul(base, M(0, h, 0, R(-0.3, 0.3), R(0, TAU), R(-0.3, 0.3))), C(hex));
    } else if (type === 'tulip') {
      s = R(0.9, 1.2); h = R(0.5, 0.85);
      base = M(x, 0, z, 0, R(0, TAU), 0, s); stemAndLeaves(base, h, 1.6);
      put('tulip', mul(base, M(0, h, 0, R(-0.15, 0.15), R(0, TAU), R(-0.15, 0.15))), C(hex));
    } else if (type === 'daisy') {
      s = R(0.65, 0.9); h = R(0.3, 0.6);
      base = M(x, 0, z, 0, R(0, TAU), 0, s); stemAndLeaves(base, h, 0.9);
      head = mul(base, M(0, h, 0, R(-0.35, 0.35), 0, R(-0.35, 0.35)));
      put('center', mul(head, M(0, 0.015, 0)), C(0xffc93c));
      var off = R(0, 1), n = 11, pc = C(hex);
      for (var i = 0; i < n; i++) put('petal', mul(mul(head, M(0, 0, 0, 0, off + i * TAU / n, 0)), M(0, 0, 0, -0.2, 0, 0)), pc);
    } else {
      s = R(0.8, 1.25); h = R(0.35, 0.7);
      base = M(x, 0, z, 0, R(0, TAU), 0, s); stemAndLeaves(base, h, 1);
      put('pom', mul(base, M(0, h + 0.12, 0, R(0, 3), R(0, 3), 0)), C(hex));
    }
  }

  // ---------------------------------------------------------------- floating island
  var ISLAND = 13, DECK = 0.08, DECK_R = 4.6, STONES = [];
  (function island() {
    var c = canvas(512, 512), g = c.getContext('2d');
    g.fillStyle = '#9ccf7c'; g.fillRect(0, 0, 512, 512);
    for (var i = 0; i < 9000; i++) {
      var x = rnd() * 512, y = rnd() * 512;
      g.strokeStyle = rnd() < 0.5 ? 'rgba(112,176,90,0.55)' : 'rgba(188,226,152,0.5)';
      g.lineWidth = 1 + rnd();

  document.getElementById('confetti').addEventListener('click', function () {
    burst(new V3(0, cakeTop + 1, 0), 160, 5.5, PARTY_COLS);
    burst(new V3(-5.6, 6.2, -2.6), 80, 3.5, PARTY_COLS);
    burst(new V3(5.6, 6.2, -2.6), 80, 3.5, PARTY_COLS);
    shower(200);
    noise(0.2, 2400, 'highpass', 0.25);
  });

  // the birthday song starts at the first tap or key press and keeps looping until it is stopped
  var songBtn = document.getElementById('song');
  var songOn = false, songAuto = true, songStarted = false, songTimer = null;
  function startSong() {
    var ctx = audio();
    if (!ctx) { songBtn.textContent = 'Sound is not available here'; songBtn.disabled = true; return; }
    songStarted = true; songOn = true;
    songGain = ctx.createGain(); songGain.gain.value = 0.75; songGain.connect(master);
    songBtn.textContent = 'Stop the song';
    loopSong();
  }
  function loopSong() {
    if (!songOn) return;
    var dur = playSong();
    songTimer = setTimeout(function () {
      if (!songOn) return;
      burst(new V3(0, cakeTop + 1, 0), 70, 4.5, PARTY_COLS);
      loopSong();
    }, (dur + 1.2) * 1000);
  }
  function stopSong() {
    songOn = false; clearTimeout(songTimer);
    if (songGain && actx) {
      var old = songGain;
      try { old.gain.setTargetAtTime(0, actx.currentTime, 0.04); } catch (e) { /* already silent */ }
      setTimeout(function () { try { old.disconnect(); } catch (e) { /* already disconnected */ } }, 400);
    }
    songGain = null;
    songBtn.textContent = 'Play the song';
  }
  songBtn.addEventListener('click', function () {
    if (songOn) { songAuto = false; stopSong(); }
    else startSong();
  });
  function firstGesture(e) {
    if (songStarted || !songAuto) return;
    if (e.target && e.target.closest && e.target.closest('#song')) return;
    startSong();
  }
  ['pointerup', 'keydown', 'touchend'].forEach(function (type) { window.addEventListener(type, firstGesture, true); });

  var spinBtn = document.getElementById('spin');
  function syncSpin() {
    spinBtn.textContent = spinOn && (camMode === 'free' || camMode === 'overview') ? 'Stop spinning' : 'Spin the view';
  }
  spinBtn.addEventListener('click', function () {
    if (spinOn && (camMode === 'free' || camMode === 'overview')) spinOn = false;
    else {
      spinOn = true;
      if (camMode !== 'free') { stopTour(); markHere(null); setCamMode('overview'); }
    }
    syncSpin();
  });
  syncSpin();

  // name on the banner
  // the birthday girl is always Beboy
  var GIRL_NAME = 'Beboy';
  function currentName() { return GIRL_NAME; }
  function drawNamedText() {
    drawBanner(GIRL_NAME);
    drawWishSign(GIRL_NAME);
    labelDraws.forEach(function (f) { f(); });
  }
  drawNamedText();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('700 100px "Dancing Script"'), document.fonts.load('800 48px "Nunito"')]).then(drawNamedText, drawNamedText);
  }

  // tap to pop balloons or blow out candles
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), el = renderer.domElement;
  function pickAt(x, y) {
    var r = el.getBoundingClientRect();
    ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(clickables, false);
    for (var i = 0; i < hits.length; i++) {
      var u = hits[i].object.userData;
      if (u.balloon && u.balloon.state !== 'idle') continue;
      return u;
    }
    return null;
  }
  function pop(b) {
    b.state = 'popped'; b.timer = 2.6;
    b.mesh.visible = false; b.line.visible = false;
    burst(b.mesh.position.clone(), 70, 3.4, [b.hex, 0xffffff, 0xffd166, 0xf27aa5]);
    noise(0.12, 2600, 'lowpass', 0.9);
  }
  var downX = 0, downY = 0, tookCam = false;
  var groundPlane = new THREE.Plane(new V3(0, 1, 0), -0.04), hitPoint = new V3();
  // dragging or zooming hands the camera back to you
  function userTookCamera() {
    if (camMode === 'guide') { setCamMode('follow'); followEase = 0; }
    else if (camMode === 'overview') setCamMode('free');
    else if (camMode === 'follow') followEase = 0;
  }
  el.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; tookCam = false; });
  el.addEventListener('pointerup', function (e) {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
    var hit = pickAt(e.clientX, e.clientY);
    if (hit) {
      if (hit.balloon) pop(hit.balloon);
      else if (hit.cake) setCandles(!candlesLit);
      else if (hit.girl) girlHello();
      else if (hit.spot) goSpot(hit.spot, false);
      return;
    }
    if (ray.ray.intersectPlane(groundPlane, hitPoint) && Math.hypot(hitPoint.x, hitPoint.z) < ISLAND - 0.5) walkTo(hitPoint.x, hitPoint.z);
  });
  el.addEventListener('wheel', userTookCamera, { passive: true });
  var lastHover = 0;
  el.addEventListener('pointermove', function (e) {
    if (e.buttons) {
      if (!tookCam && Math.hypot(e.clientX - downX, e.clientY - downY) > 6) { tookCam = true; userTookCamera(); }
      return;
    }
    if (e.pointerType !== 'mouse') return;
    var now = performance.now(); if (now - lastHover < 70) return; lastHover = now;
    el.style.cursor = pickAt(e.clientX, e.clientY) ? 'pointer' : 'grab';
  });
  el.style.cursor = 'grab';

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------------------------------------------------------- animation
  var up = new V3(0, 1, 0), tmp = new V3(), tmp2 = new V3(), knotW = new V3(), qY = new THREE.Quaternion();
  function easeOutBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function updateBalloons(t, dt) {
    balloons.forEach(function (b) {
      if (b.state === 'popped') {
        b.timer -= dt;
        if (b.timer <= 0) { b.state = 'grow'; b.grow = 0; b.mesh.visible = true; b.line.visible = true; }
        return;
      }
      var s = 1;
      if (b.state === 'grow') {
        b.grow = Math.min(1, b.grow + dt / 0.9);
        s = Math.max(0.01, easeOutBack(b.grow));
        if (b.grow >= 1) b.state = 'idle';
      }
      var m = b.mesh;
      m.position.set(
        b.rest.x + Math.sin(t * 0.6 + b.ph) * 0.15,
        b.rest.y + Math.sin(t * 0.9 + b.ph * 1.3) * 0.12,
        b.rest.z + Math.cos(t * 0.5 + b.ph) * 0.15);
      m.scale.setScalar(s);
      tmp.copy(m.position).sub(b.anchor).normalize().lerp(up, 0.45).normalize();
      m.quaternion.setFromUnitVectors(up, tmp);
      if (b.kind === 'heart') { qY.setFromAxisAngle(up, Math.sin(t * 0.5 + b.ph) * 0.45); m.quaternion.multiply(qY); }
      knotW.set(0, -0.66 * s, 0).applyQuaternion(m.quaternion).add(m.position);
      var pos = b.line.geometry.attributes.position, a = b.anchor;
      var cx = (knotW.x + a.x) / 2 + Math.sin(t * 0.9 + b.ph) * 0.15, cy = (knotW.y + a.y) / 2, cz = (knotW.z + a.z) / 2 + Math.cos(t * 0.7 + b.ph) * 0.15;
      for (var i = 0; i <= b.N; i++) {
        var u = i / b.N, iu = 1 - u;
        pos.setXYZ(i, iu * iu * knotW.x + 2 * iu * u * cx + u * u * a.x, iu * iu * knotW.y + 2 * iu * u * cy + u * u * a.y, iu * iu * knotW.z + 2 * iu * u * cz + u * u * a.z);
      }
      pos.needsUpdate = true;
    });
  }
  function updateCandles(t, dt) {
    flameLevel += ((candlesLit ? 1 : 0) - flameLevel) * Math.min(1, dt * (candlesLit ? 4 : 9));
    var on = flameLevel > 0.02;
    flames.forEach(function (f, i) {
      f.g.visible = on; f.sp.visible = on;
      var fl = 1 + 0.12 * Math.sin(t * 23 + f.ph) + 0.06 * Math.sin(t * 41 + i * 2);
      f.g.scale.set(flameLevel, flameLevel * fl, flameLevel);
      f.g.position.x = f.base.x + Math.sin(t * 17 + f.ph) * 0.006;
    });
    glowMat.opacity = flameLevel * (0.8 + 0.2 * Math.sin(t * 19));
    candleLight.intensity = 0.9 * flameLevel * (0.88 + 0.12 * Math.sin(t * 21) * Math.sin(t * 13));
  }
  function updateScenery(t, dt) {
    for (var i = 0; i < BULBS; i++) {
      tmpC.copy(bulbBase[i]).multiplyScalar(0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.2 + i * 1.7)));
      bulbs.setColorAt(i, tmpC);
    }
    bulbs.instanceColor.needsUpdate = true;
    flags.forEach(function (f) { f.m.rotation.x = Math.sin(t * 2 + f.ph) * 0.18; });
    clouds.forEach(function (c, i) {
      c.a += c.sp * dt;
      c.g.position.set(Math.sin(c.a) * c.r, c.y + Math.sin(t * 0.3 + i) * 0.3, Math.cos(c.a) * c.r);
    });
    butterflies.forEach(function (b) {
      butterflyPos(b, t, b.g.position);
      butterflyPos(b, t + 0.05, tmp2);
      b.g.lookAt(tmp2);
      var flap = Math.sin(t * 18 + b.ph) * 0.8 + 0.25;
      b.R.rotation.z = flap; b.L.rotation.z = -flap;
    });
  }

  var clock = new THREE.Clock();
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    updateBalloons(t, dt);
    updateCandles(t, dt);
    updateSmoke(dt);
    updateConfetti(dt);
    updatePetals(t, dt);
    updateScenery(t, dt);
    updateGirl(t, dt);
    updateCamera(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
